[package]
name = "gzts"
version = "0.1.0"
edition = "2021"
description = "High-performance parallel gzip XML timestamp rewriter"
license = "MIT"

[dependencies]
chrono = "0.4"
flate2 = "1.1"
memchr = "2.7"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
